# Alembic CLI configuration. Run from the repository root, e.g.:
#   alembic upgrade head
#   alembic current
# The database URL is taken from the project settings (ACM_DATABASE_PATH / .env)
# unless sqlalchemy.url is set below. Scripts call database.migrate_database(),
# which also verifies and stamps pre-Alembic Part 1 databases.

[alembic]
script_location = %(here)s/src/aircraft_cost_model/migrations
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
