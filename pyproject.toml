[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-aircraft-cost-model"
version = "0.2.0"
description = "Open Aircraft Operating Cost Model - data, flight performance, operating costs and analytics (Parts 1-5)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - to be decided by project owner" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "requests>=2.31",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    # Reads the EIA historical .xls download (the only key-free machine-readable source).
    "xlrd>=2.0",
    "python-dotenv>=1.0",
    # Aircraft master data (Part 1) and performance / fuel-flow models (Part 2).
    # Pinned to the inspected minor version: the adapter relies on its data layout.
    "openap>=2.6,<2.7",
    # Static PNG charts for Part 5 analytical reports (Agg backend, no GUI).
    "matplotlib>=3.8",
    # Part 6: FAA Aircraft Characteristics Database (XLSX) and the explorer API.
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aircraft_cost_model = ["migrations/script.py.mako", "api/content/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
